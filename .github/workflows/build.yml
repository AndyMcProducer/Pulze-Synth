name: Build Pulze Synth

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Pulze_Synth_Windows
            formats: VST3
          - os: macos-latest
            artifact: Pulze_Synth_macOS
            formats: VST3 AU

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Zip Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd build/Pulze_artefacts/Release
          7z a ../../Pulze_Synth_Windows_VST3.zip ./VST3/Pulze.vst3

      - name: Zip Artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd build/Pulze_artefacts/Release
          zip -r ../../Pulze_Synth_macOS_VST3_AU.zip ./VST3/Pulze.vst3 ./AU/Pulze.component

      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}_Zip
          path: build/*.zip

      - name: Package with CPack
        shell: bash
        run: |
          cd build
          if [ "${{ runner.os }}" == "Windows" ]; then
            cpack -G NSIS
          else
            cpack -G DragNDrop
          fi

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}_Installer
          path: |
            build/*.exe
            build/*.dmg

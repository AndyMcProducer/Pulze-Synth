name: Build Pulze Synth

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
      - 'V*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Pulze_Synth_Windows
            formats: VST3
          - os: macos-latest
            artifact: Pulze_Synth_macOS
            formats: VST3 AU

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Zip Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd build/Pulze_artefacts/Release
          7z a ../../Pulze_Synth_Windows_VST3.zip ./VST3/Pulze.vst3

      - name: Zip Artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd build/Pulze_artefacts/Release
          zip -r ../../Pulze_Synth_macOS_VST3_AU.zip ./VST3/Pulze.vst3 ./AU/Pulze.component

      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}_Zip
          path: build/*.zip

      - name: Package with CPack
        shell: bash
        run: |
          cd build
          if [ "${{ runner.os }}" == "Windows" ]; then
            cpack -G NSIS
          else
            cpack -G DragNDrop
          fi

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}_Installer
          path: |
            build/*.exe
            build/*.dmg

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/*.zip
            release_assets/*.exe
            release_assets/*.dmg
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
